    "/products": {
      "get": {
        "tags": [
          "Products"
        ],
        "summary": "List products",
        "operationId": "getProducts",
        "parameters": [
          {
            "$ref": "#/components/parameters/Page"
          },
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "name": "q",
            "in": "query",
            "description": "Case-insensitive substring of the name or description.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            }
          },
          {
            "name": "categoryId",
            "in": "query",
            "description": "Category ID.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 2147483647
            }
          },
          {
            "name": "brandId",
            "in": "query",
            "description": "Brand ID.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 2147483647
            }
          },
          {
            "name": "hasBrand",
            "in": "query",
            "description": "False returns products with no brand.",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "minYear",
            "in": "query",
            "description": "Earliest release year, inclusive.",
            "schema": {
              "type": "integer",
              "minimum": 1900,
              "maximum": 2147483647,
              "description": "At most next calendar year."
            }
          },
          {
            "name": "maxYear",
            "in": "query",
            "description": "Latest release year, inclusive.",
            "schema": {
              "type": "integer",
              "minimum": 1900,
              "maximum": 2147483647,
              "description": "At most next calendar year."
            }
          },
          {
            "name": "inStock",
            "in": "query",
            "description": "Filter by availability.",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "sort",
            "in": "query",
            "description": "Product sort field.",
            "schema": {
              "type": "string",
              "enum": [
                "name",
                "releaseYear",
                "price",
                "createdAt"
              ],
              "default": "createdAt"
            }
          },
          {
            "$ref": "#/components/parameters/Order"
          },
          {
            "name": "minRating",
            "in": "query",
            "description": "Minimum average review rating.",
            "schema": {
              "type": "number",
              "minimum": 1,
              "maximum": 5
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProductList"
                }
              }
            }
          },
          "400": {
            "description": "Invalid identifier, query or JSON body.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "message": "Invalid value",
                  "field": "rating"
                }
              }
            }
          }
        }
      },
      "post": {
        "tags": [
          "Products"
        ],
        "summary": "Create a product",
        "operationId": "postProducts",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ProductCreate"
              },
              "example": {
                "name": "USB-C 65W Charger",
                "releaseYear": 2024,
                "price": 99000,
                "description": "Compact wall charger",
                "inStock": true,
                "categoryId": 1,
                "brandId": null
